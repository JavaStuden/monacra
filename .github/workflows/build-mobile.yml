name: Build Monarca Mobile Apps (APK & IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Sync Android
        working-directory: monarca-mobile-app
        run: |
          npm ci
          npx cap sync android

      - name: Build Android APK
        working-directory: monarca-mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Monarca-Android-APK
          path: monarca-mobile-app/android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies, Sync iOS & Install Pods
        working-directory: monarca-mobile-app
        run: |
          npm ci
          npx cap sync ios
          rm -rf ios/App/App.xcworkspace
          cd ios/App && pod install

      - name: Build & Archive iOS App
        working-directory: monarca-mobile-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -archivePath ./build/App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA (for AltStore / Sideloadly / TrollStore)
        working-directory: monarca-mobile-app/ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R ./build/App.xcarchive/Products/Applications/App.app Payload/App.app
          mkdir -p ../../release
          zip -qry ../../release/Monarca-v4.7.0.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monarca-iOS-IPA
          path: monarca-mobile-app/release/Monarca-v4.7.0.ipa
