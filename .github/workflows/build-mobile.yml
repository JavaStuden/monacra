name: Build Monarca Mobile Apps (APK & IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Sync Android
        working-directory: monarca-mobile-app
        run: |
          npm ci
          npx cap sync android

      - name: Configure Android Release Signing
        env:
          MONARCA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MONARCA_ANDROID_KEYSTORE_BASE64 }}
          MONARCA_ANDROID_STORE_PASSWORD: ${{ secrets.MONARCA_ANDROID_STORE_PASSWORD }}
          MONARCA_ANDROID_KEY_ALIAS: ${{ secrets.MONARCA_ANDROID_KEY_ALIAS }}
          MONARCA_ANDROID_KEY_PASSWORD: ${{ secrets.MONARCA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/monarca-release.jks"
          if [[ -n "$MONARCA_ANDROID_KEYSTORE_BASE64" || -n "$MONARCA_ANDROID_STORE_PASSWORD" || -n "$MONARCA_ANDROID_KEY_ALIAS" || -n "$MONARCA_ANDROID_KEY_PASSWORD" ]]; then
            if [[ -z "$MONARCA_ANDROID_KEYSTORE_BASE64" || -z "$MONARCA_ANDROID_STORE_PASSWORD" || -z "$MONARCA_ANDROID_KEY_ALIAS" || -z "$MONARCA_ANDROID_KEY_PASSWORD" ]]; then
              echo "Android signing secrets are incomplete. Configure all four MONARCA_ANDROID_* repository secrets." >&2
              exit 1
            fi
            echo "$MONARCA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "MONARCA_ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "MONARCA_ANDROID_STORE_PASSWORD=$MONARCA_ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MONARCA_ANDROID_KEY_ALIAS=$MONARCA_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MONARCA_ANDROID_KEY_PASSWORD=$MONARCA_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "MONARCA_SIGNING_MODE=persistent" >> "$GITHUB_ENV"
            echo "Using the persistent Android release signing key." >> "$GITHUB_STEP_SUMMARY"
          else
            PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -alias monarca \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASSWORD" \
              -keypass "$PASSWORD" \
              -dname "CN=Monarca, OU=Mobile, O=Monarca Boutique, L=Baghdad, ST=Baghdad, C=IQ"
            echo "MONARCA_ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "MONARCA_ANDROID_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "MONARCA_ANDROID_KEY_ALIAS=monarca" >> "$GITHUB_ENV"
            echo "MONARCA_ANDROID_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "MONARCA_SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            {
              echo "### Android signing"
              echo "This APK is signed with a temporary key and can be installed as a fresh install. Future builds use different keys, so Android cannot install them as updates over this APK. Configure the four repository secrets for a stable signing identity."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Signed Android APK
        working-directory: monarca-mobile-app/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ../release
          cp "$APK" ../release/Monarca-v4.7.0.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Monarca-Android-APK
          path: monarca-mobile-app/release/Monarca-v4.7.0.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies, Sync iOS & Install Pods
        working-directory: monarca-mobile-app
        run: |
          npm ci
          npx cap sync ios
          rm -rf ios/App/App.xcworkspace
          cd ios/App && pod install

      - name: Build & Archive iOS App
        working-directory: monarca-mobile-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -archivePath ./build/App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA (for AltStore / Sideloadly / TrollStore)
        working-directory: monarca-mobile-app/ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R ./build/App.xcarchive/Products/Applications/App.app Payload/App.app
          mkdir -p ../../release
          zip -qry ../../release/Monarca-v4.7.0.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monarca-iOS-IPA
          path: monarca-mobile-app/release/Monarca-v4.7.0.ipa
