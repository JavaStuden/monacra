name: Build Monarca uni-app resources

on:
  push:
    paths:
      - 'monarca-uniapp/**'
      - '.github/workflows/build-uniapp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: monarca-uniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: monarca-uniapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:h5
      - run: npm run build:app
      - uses: actions/upload-artifact@v4
        with:
          name: Monarca-uniapp-H5-and-App-resources
          path: monarca-uniapp/dist/build/
          if-no-files-found: error
